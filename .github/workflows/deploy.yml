name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch.
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment. Skip pending runs in the same branch.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          # The Astro project lives at the repository root.
          path: .
          # Node 24 satisfies the `engines.node` requirement in package.json.
          node-version: 24
          # pnpm is detected from pnpm-lock.yaml, but pin it for reproducibility.
          package-manager: pnpm@10.11.0
          # `pnpm build` runs `astro check`, `astro build`, then `pagefind`.
          build-cmd: pnpm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
